[package]
name = "brz-replay"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/we-breeze/replay"
description = "Replay-controlled Tokio waits for Target applications"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[lints.rust]
unsafe_code = "deny"
